<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            row-gap: 50px;
            grid-template-columns: auto auto auto;
            background-color: rgb(195, 213, 231);
            padding: 10px;
            column-gap: 50px;
            row-gap: 1px;
        }
        .container > div {
            background-color: #f1f1f1;
            border: 1px solid black;
            padding: 20px;
            font-size: 30px;
            text-align: center;
        }
        .borda {
            border: 3px solid #631111;                  
            text-align: center;
            background-color: rgb(82, 127, 152);
        }
    </style>
</head>
<body>
    <div class="container">
        <h4 class="borda">testegrid</h4>
        <h4 class="borda">testegrid</h4>
        <h4 class="borda">testegrid</h4>
        <h4 class="borda">testegrid</h4>
        <h4 class="borda">testegrid</h4>
        <h4 class="borda">testegrid</h4>
        <h4 class="borda">testegrid</h4>
        <h4 class="borda">testegrid</h4>
    </div>
    
</body>
</html>
