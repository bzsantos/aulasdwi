<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags</title>
</head>
<body style="background-color: cadetblue;">

    <!-- 1º Formatação - margin, border & padding
         2º Forms - inputs e buttons  -->

    <div style="margin: 25px; 
                border: 1px solid #171616; 
                padding-left: 500px; 
                padding-right: 500px; 
                padding-top: 10px; 
                padding-bottom: 10px;
                background: bisque;">     

    <h1>cadastro de desenhos japonês</h1>   
 
    <img src="img/goku.jpg" alt="Goku" width="400px" height="250px">

    <p style="color:brown; 
              font-size: 22px; 
              font-family:'Times New Roman', Times, serif; text-align: justify;">Escolha os desenhos favoritos e cadastre seus dados para fazer uma lista de personagens com poderes e habilidades acima do normal
    </p>
   
    <form>        
        <div style="text-align: center;">
        <input type="text" id="personagem" placeholder="Insira o nome do personagem" style="width: 400px;gap: 10px; border-radius: 7px;">
        <br>
        <br>
        
        <input type="texto" id="anime" placeholder="Qual o nome do anime" style="width: 400px;gap: 10px;border-radius: 7px;">     
        <br>
        <br>   
        <button type="button" style="background-color: cadetblue;border-radius:10px; width: 120px; height: 25px;">Cadastrar</button>
        </div>
    </form>

    </div>

   

</body>
</html>
